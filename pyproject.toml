[project]
name = "pots-2.0"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # BLAKE3 is the protocol's hash, PRF and challenge expansion (DECISIONS_SETUP S9).
    "blake3>=1.0.9",
    "datasets>=5.0.0",
    # The result figures (evaluation/output.py); exact, so a rerun draws the same figure.
    "matplotlib==3.11.2",
    # NVML (the driver's monitoring library, imported as pynvml): the profile's GPU facts and
    # sampler (docs/verification/PROFILING_PLAN.md). Imported lazily; absent GPUs give nulls.
    "nvidia-ml-py>=13.615.71",
    # Process and host counters for the profile's sampler (setup/sampler.py).
    "psutil>=7.2.2",
    "torch",
    # Pin to 4.x: the decoder product inventory (verification/computation/instances/decoder.py)
    # follows the matmul order of transformers 4.57.6's Llama and Qwen2 forward (pinned at T0),
    # and test_decoder.py patches modeling_llama internals. 5.x is untested here.
    "transformers>=4.52.4,<5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: loads the real model or runs a full training step"]
