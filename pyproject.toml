[project]
name = "pots-2.0"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # BLAKE3 is the protocol's hash, PRF and challenge expansion (DECISIONS_SETUP S9).
    "blake3>=1.0.9",
    "datasets>=5.0.0",
    "torch",
    # Pin to 4.x: the SmolLM2 product inventory (verification/instances/llama.py) follows
    # the matmul order of transformers 4.57.6's Llama forward (pinned at T0), and
    # test_llama.py patches modeling_llama internals. 5.x is untested here.
    "transformers>=4.52.4,<5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: loads the real model or runs a full training step"]
